name: Deploy to EC2

on:
  push:
    branches:
      - main   # 或你要自動部署的分支

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Copy files to EC2
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -p ${{ secrets.EC2_PORT || 22 }}" \
            --exclude '.git' --exclude 'node_modules' --exclude '.github' \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/eolc-backend

      - name: Deploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.EC2_PORT || 22 }} ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~/eolc-backend
            docker-compose down || true
            docker-compose build --no-cache
            docker-compose up -d
          EOF